version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: exam_timetable_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: exam_timetable
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam_timetable_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/exam_timetable
      - SECRET_KEY=exam_timetable_super_secret_jwt_key_hell_edition_2026_change_in_production
      - ENVIRONMENT=production
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:3000", "http://localhost:80"]
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exam_timetable_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
